type Shop {
  id: ID!
  name: String!
  slug: String!
  region: String
  userName: String
  category: String
  address: String
  notes: String
  ordersByPhoneOrWhatsApp: String
  delivery: String
  takeaway: String
  whatsAppNumber: String
  phoneNumber: String
  email: String
  submittedAt: String
  openTimes: String
  deliveryCost: String
  visibility: Visibility
  logo: String
  background: String
  typeformToken: String
  ordersPhoneNumber: String
  ordersWhatsAppNumber: String
  products(filter: ModelProductFilterInput, sortDirection: ModelSortDirection, limit: Int, nextToken: String): ModelProductConnection
}

enum Visibility {
  public
  private
}

type Product {
  id: ID!
  category: String!
  name: String!
  description: String
  price: Float
  shop: Shop
  itemNumber: Int
}

enum ModelSortDirection {
  ASC
  DESC
}

type ModelShopConnection {
  items: [Shop]
  nextToken: String
}

input ModelStringInput {
  ne: String
  eq: String
  le: String
  lt: String
  ge: String
  gt: String
  contains: String
  notContains: String
  between: [String]
  beginsWith: String
  attributeExists: Boolean
  attributeType: ModelAttributeTypes
  size: ModelSizeInput
}

input ModelIDInput {
  ne: ID
  eq: ID
  le: ID
  lt: ID
  ge: ID
  gt: ID
  contains: ID
  notContains: ID
  between: [ID]
  beginsWith: ID
  attributeExists: Boolean
  attributeType: ModelAttributeTypes
  size: ModelSizeInput
}

input ModelIntInput {
  ne: Int
  eq: Int
  le: Int
  lt: Int
  ge: Int
  gt: Int
  between: [Int]
  attributeExists: Boolean
  attributeType: ModelAttributeTypes
}

input ModelFloatInput {
  ne: Float
  eq: Float
  le: Float
  lt: Float
  ge: Float
  gt: Float
  between: [Float]
  attributeExists: Boolean
  attributeType: ModelAttributeTypes
}

input ModelBooleanInput {
  ne: Boolean
  eq: Boolean
  attributeExists: Boolean
  attributeType: ModelAttributeTypes
}

input ModelSizeInput {
  ne: Int
  eq: Int
  le: Int
  lt: Int
  ge: Int
  gt: Int
  between: [Int]
}

input ModelVisibilityInput {
  eq: Visibility
  ne: Visibility
}

input ModelShopFilterInput {
  id: ModelIDInput
  name: ModelStringInput
  slug: ModelStringInput
  region: ModelStringInput
  userName: ModelStringInput
  category: ModelStringInput
  address: ModelStringInput
  notes: ModelStringInput
  ordersByPhoneOrWhatsApp: ModelStringInput
  delivery: ModelStringInput
  takeaway: ModelStringInput
  whatsAppNumber: ModelStringInput
  phoneNumber: ModelStringInput
  email: ModelStringInput
  submittedAt: ModelStringInput
  openTimes: ModelStringInput
  deliveryCost: ModelStringInput
  visibility: ModelVisibilityInput
  logo: ModelStringInput
  background: ModelStringInput
  typeformToken: ModelStringInput
  ordersPhoneNumber: ModelStringInput
  ordersWhatsAppNumber: ModelStringInput
  and: [ModelShopFilterInput]
  or: [ModelShopFilterInput]
  not: ModelShopFilterInput
}

type Query {
  getShop(id: ID!): Shop
  listShops(filter: ModelShopFilterInput, limit: Int, nextToken: String): ModelShopConnection
  getProduct(id: ID!): Product
  listProducts(filter: ModelProductFilterInput, limit: Int, nextToken: String): ModelProductConnection
}

input CreateShopInput {
  id: ID
  name: String!
  slug: String!
  region: String
  userName: String
  category: String
  address: String
  notes: String
  ordersByPhoneOrWhatsApp: String
  delivery: String
  takeaway: String
  whatsAppNumber: String
  phoneNumber: String
  email: String
  submittedAt: String
  openTimes: String
  deliveryCost: String
  visibility: Visibility
  logo: String
  background: String
  typeformToken: String
  ordersPhoneNumber: String
  ordersWhatsAppNumber: String
}

input UpdateShopInput {
  id: ID!
  name: String
  slug: String
  region: String
  userName: String
  category: String
  address: String
  notes: String
  ordersByPhoneOrWhatsApp: String
  delivery: String
  takeaway: String
  whatsAppNumber: String
  phoneNumber: String
  email: String
  submittedAt: String
  openTimes: String
  deliveryCost: String
  visibility: Visibility
  logo: String
  background: String
  typeformToken: String
  ordersPhoneNumber: String
  ordersWhatsAppNumber: String
}

input DeleteShopInput {
  id: ID
}

type Mutation {
  createShop(input: CreateShopInput!, condition: ModelShopConditionInput): Shop
  updateShop(input: UpdateShopInput!, condition: ModelShopConditionInput): Shop
  deleteShop(input: DeleteShopInput!, condition: ModelShopConditionInput): Shop
  createProduct(input: CreateProductInput!, condition: ModelProductConditionInput): Product
  updateProduct(input: UpdateProductInput!, condition: ModelProductConditionInput): Product
  deleteProduct(input: DeleteProductInput!, condition: ModelProductConditionInput): Product
}

input ModelShopConditionInput {
  name: ModelStringInput
  slug: ModelStringInput
  region: ModelStringInput
  userName: ModelStringInput
  category: ModelStringInput
  address: ModelStringInput
  notes: ModelStringInput
  ordersByPhoneOrWhatsApp: ModelStringInput
  delivery: ModelStringInput
  takeaway: ModelStringInput
  whatsAppNumber: ModelStringInput
  phoneNumber: ModelStringInput
  email: ModelStringInput
  submittedAt: ModelStringInput
  openTimes: ModelStringInput
  deliveryCost: ModelStringInput
  visibility: ModelVisibilityInput
  logo: ModelStringInput
  background: ModelStringInput
  typeformToken: ModelStringInput
  ordersPhoneNumber: ModelStringInput
  ordersWhatsAppNumber: ModelStringInput
  and: [ModelShopConditionInput]
  or: [ModelShopConditionInput]
  not: ModelShopConditionInput
}

enum ModelAttributeTypes {
  binary
  binarySet
  bool
  list
  map
  number
  numberSet
  string
  stringSet
  _null
}

type Subscription {
  onCreateShop: Shop @aws_subscribe(mutations: ["createShop"])
  onUpdateShop: Shop @aws_subscribe(mutations: ["updateShop"])
  onDeleteShop: Shop @aws_subscribe(mutations: ["deleteShop"])
  onCreateProduct: Product @aws_subscribe(mutations: ["createProduct"])
  onUpdateProduct: Product @aws_subscribe(mutations: ["updateProduct"])
  onDeleteProduct: Product @aws_subscribe(mutations: ["deleteProduct"])
}

type ModelProductConnection {
  items: [Product]
  nextToken: String
}

input ModelProductFilterInput {
  id: ModelIDInput
  category: ModelStringInput
  name: ModelStringInput
  description: ModelStringInput
  price: ModelFloatInput
  itemNumber: ModelIntInput
  and: [ModelProductFilterInput]
  or: [ModelProductFilterInput]
  not: ModelProductFilterInput
}

input CreateProductInput {
  id: ID
  category: String!
  name: String!
  description: String
  price: Float
  itemNumber: Int
  productShopId: ID
}

input UpdateProductInput {
  id: ID!
  category: String
  name: String
  description: String
  price: Float
  itemNumber: Int
  productShopId: ID
}

input DeleteProductInput {
  id: ID
}

input ModelProductConditionInput {
  category: ModelStringInput
  name: ModelStringInput
  description: ModelStringInput
  price: ModelFloatInput
  itemNumber: ModelIntInput
  and: [ModelProductConditionInput]
  or: [ModelProductConditionInput]
  not: ModelProductConditionInput
}
