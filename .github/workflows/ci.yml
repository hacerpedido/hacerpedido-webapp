name: HacerPedido CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm run lint:markdown
      - run: pnpm typecheck
      - run: pnpm exec jest --runInBand --coverage
      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        # Keep coverage reporting non-blocking while the repository is private.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'next.config.*', 'instrumentation*', 'sentry.*.config.*', 'tsconfig.json', 'app/**/*', 'components/**/*', 'lib/**/*', 'assets/**/*', 'styles/**/*', 'public/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      # The E2E command starts the same Docker Compose stack used locally,
      # runs Knex migrations + seed, builds and serves the app, then
      # runs the browser journey against it.
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'next.config.*', 'instrumentation*', 'sentry.*.config.*', 'tsconfig.json', 'app/**/*', 'components/**/*', 'lib/**/*', 'assets/**/*', 'styles/**/*', 'public/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      - run: pnpm build
