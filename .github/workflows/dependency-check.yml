name: Dependency & Security Check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency Review requires GitHub Advanced Security, which is unavailable
  # while this repository is private on its current plan. Re-enable this job
  # when the repository becomes public or Advanced Security is licensed.
  depcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps:check
      - name: Audit dependencies
        run: pnpm audit --audit-level=high --json > pnpm-audit.json
        continue-on-error: true
      - name: Upload audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-audit-report
          path: pnpm-audit.json
          retention-days: 7
          if-no-files-found: ignore
