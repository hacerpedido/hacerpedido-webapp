pre-commit:
  commands:
    biome-check:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css}"
      run: npx --no-install biome check --write {staged_files}
      stage_fixed: true
    markdownlint:
      glob: "*.{md,markdown}"
      run: pnpm exec markdownlint-cli2 --no-globs {staged_files}
